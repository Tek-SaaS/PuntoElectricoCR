<!DOCTYPE html>
<html lang="es" data-theme="day" data-lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Punto Eléctrico CR — Mapa</title>
  <meta name="description" content="Mapa interactivo de cargadores para vehículos eléctricos en Costa Rica." />

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b6b3a'/%3E%3Cpath d='M20 3L9 18h8l-5 11L26 14h-9z' fill='%23ffffff'/%3E%3C/svg%3E">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,700;0,900;1,700&family=Epilogue:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/map.css" />
</head>
<body class="no-scroll">

  <header class="topbar" id="topbar">
    <div class="topbar-left">
      <a href="index.html" class="logo">
        <span class="logo-bolt">⚡</span>
        <span class="logo-name" data-i18n="appName">Punto Eléctrico CR</span>
      </a>
      <nav class="nav-links">
        <a href="index.html" class="nav-link" data-i18n="navMap">Mapa</a>
        <a href="home.html" class="nav-link" data-i18n="navHome">Noticias</a>
        <a href="sobre.html" class="nav-link" data-i18n="navAbout">Sobre</a>
      </nav>
      <div class="stats-strip">
        <div class="stat-item">
          <span class="stat-n" id="statTotal">—</span>
          <span class="stat-l">estaciones</span>
        </div>
        <div class="stat-sep"></div>
        <div class="stat-item">
          <span class="stat-n" id="statOp">—</span>
          <span class="stat-l">operativas</span>
        </div>
        <div class="stat-sep"></div>
        <div class="stat-item">
          <span class="stat-n" id="statConn">—</span>
          <span class="stat-l">conectores</span>
        </div>
      </div>
    </div>
    <div class="topbar-right">
      <button class="ctrl-btn" id="btnLocate" aria-label="Localizar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/></svg>
      </button>
      <button class="ctrl-btn accent" id="btnAdd">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        <span>Agregar</span>
      </button>
      <button class="lang-toggle" data-lang-toggle aria-label="Cambiar idioma">
        <span class="l-es">ES</span>
        <span class="l-div">/</span>
        <span class="l-en">EN</span>
      </button>
      <button class="theme-toggle" data-theme-toggle aria-label="Cambiar tema">
        <span class="t-day">☀</span>
        <span class="t-night">☽</span>
      </button>
    </div>
  </header>

  <div class="layout" id="layout">

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <span class="sidebar-title">Estaciones</span>
        <button class="sidebar-collapse" id="sidebarCollapse" aria-label="Ocultar lista">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
      </div>
      <div class="sidebar-top">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="searchInput" class="search-input" placeholder="Buscar estación…" autocomplete="off" />
        </div>
        <div class="filter-row">
          <select id="filterProvince" class="filter-sel">
            <option value="">Todas las provincias</option>
            <option>San José</option><option>Alajuela</option><option>Cartago</option>
            <option>Heredia</option><option>Guanacaste</option><option>Puntarenas</option><option>Limón</option>
          </select>
          <select id="filterStatus" class="filter-sel">
            <option value="">Todos</option>
            <option value="50">Operativo</option>
            <option value="75">Planeado</option>
          </select>
        </div>
        <div class="conn-row">
          <button class="conn-btn active" data-conn="all">Todos</button>
          <button class="conn-btn" data-conn="type2">Type 2</button>
          <button class="conn-btn" data-conn="ccs">CCS</button>
          <button class="conn-btn" data-conn="chademo">CHAdeMO</button>
          <button class="conn-btn" data-conn="type1">Type 1</button>
          <button class="conn-btn" data-conn="tesla">Tesla</button>
        </div>
      </div>
      <div class="station-list" id="stationList">
        <div class="list-state"><div class="spin-ring"></div><p>Cargando…</p></div>
      </div>
    </aside>

    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <div class="map-wrap">
      <div id="map"></div>

      <div class="detail-card" id="detailPanel">
        <button class="detail-close" id="detailClose" aria-label="Cerrar detalle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
        <div class="detail-body" id="detailBody"></div>
      </div>

      <div class="placement-banner" id="placementBanner">
        <div class="placement-banner-inner">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
          </svg>
          <span>Toca el mapa para marcar la ubicación</span>
          <button class="placement-cancel" id="placementCancel">Cancelar</button>
        </div>
      </div>

      <button class="fab-menu" id="fabSidebar" aria-label="Mostrar lista">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="12" y2="18"/></svg>
      </button>
    </div>

  </div>

  <!-- Modal agregar estación (idéntico al actual) -->
  <div class="modal-overlay" id="modalOverlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-drag-handle"></div>
      <div class="modal-header">
        <h2>Agregar Estación</h2>
        <button class="modal-x" id="modalClose" aria-label="Cerrar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-scroll">
        <div class="coords-pill" id="coordsPill">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          <span id="coordsPillText">—</span>
        </div>

        <form id="addForm">
          <div class="fg">
            <label>Nombre *</label>
            <input type="text" id="f_name" required placeholder="Ej: Mall San Pedro" />
          </div>
          <div class="fg">
            <label>Dirección</label>
            <input type="text" id="f_address" placeholder="Ej: 200m norte del parque" />
          </div>
          <div class="fg-row">
            <div class="fg">
              <label>Provincia</label>
              <select id="f_province">
                <option>San José</option><option>Alajuela</option><option>Cartago</option>
                <option>Heredia</option><option>Guanacaste</option><option>Puntarenas</option><option>Limón</option>
              </select>
            </div>
            <div class="fg">
              <label>Puntos de carga</label>
              <input type="number" id="f_points" min="1" value="2" />
            </div>
          </div>
          <div class="fg">
            <label>Tipo de conector</label>
            <div class="check-group">
              <label class="ck"><input type="checkbox" value="Type 2 (Mennekes)" /> Type 2</label>
              <label class="ck"><input type="checkbox" value="CCS (Type 2)" /> CCS</label>
              <label class="ck"><input type="checkbox" value="CHAdeMO" /> CHAdeMO</label>
              <label class="ck"><input type="checkbox" value="Type 1 (J1772)" /> Type 1</label>
              <label class="ck"><input type="checkbox" value="Tesla Supercharger" /> Tesla</label>
            </div>
          </div>
          <div class="fg-row">
            <div class="fg">
              <label>Potencia máx (kW)</label>
              <input type="number" id="f_power" min="1" placeholder="50" />
            </div>
            <div class="fg">
              <label>Costo</label>
              <select id="f_cost">
                <option value="Gratuito">Gratuito</option>
                <option value="De pago">De pago</option>
                <option value="Desconocido">Desconocido</option>
              </select>
            </div>
          </div>
          <div class="fg">
            <label>Red / Operador</label>
            <input type="text" id="f_network" placeholder="ICE, JASEC, privado…" />
          </div>
          <div class="fg">
            <label>Notas</label>
            <textarea id="f_notes" rows="2" placeholder="Acceso, estacionamiento…"></textarea>
          </div>
          <div class="fg-actions">
            <button type="button" class="btn-sec" id="btnCancelForm">Cancelar</button>
            <button type="submit" class="btn-pri">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
              <span>Agregar estación</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
  <script src="assets/js/shared.js"></script>
  <script src="assets/js/map.js"></script>
</body>
</html>
