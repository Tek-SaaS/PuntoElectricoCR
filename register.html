<title>Crear cuenta — Punto Eléctrico CR</title>
...
<h1 class="auth-title" data-i18n="registerTitle">Crear cuenta</h1>
<p class="auth-sub" data-i18n="registerSub">Gratis. Sin publicidad. Solo para guardar tus datos.</p>
<form id="registerForm" class="auth-form">
  <div class="fg">
    <label data-i18n="fName">Nombre</label>
    <input type="text" id="name" required autocomplete="name" />
  </div>
  <div class="fg">
    <label data-i18n="fEmail">Correo</label>
    <input type="email" id="email" required autocomplete="email" />
  </div>
  <div class="fg">
    <label data-i18n="fPassword">Contraseña</label>
    <input type="password" id="password" required minlength="6" autocomplete="new-password" />
  </div>
  <button type="submit" class="btn-pri auth-submit" data-i18n="register">Crear cuenta</button>
</form>
<p class="auth-alt">
  <span data-i18n="hasAccount">¿Ya tienes cuenta?</span>
  <a href="login.html" data-i18n="loginNow">Inicia sesión</a>
</p>
