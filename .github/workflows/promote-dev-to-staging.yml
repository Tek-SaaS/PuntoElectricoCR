name: Promote dev → staging

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo de la promoción'
        required: false
        default: 'Promoción manual'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PROMOTE_TOKEN }}

      - name: Configurar git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Traer ramas
        run: git fetch origin dev staging

      - name: Verificar que staging no tiene commits únicos
        run: |
          UNIQUE=$(git log --oneline origin/dev..origin/staging | wc -l)
          echo "Commits en staging que no están en dev: $UNIQUE"
          if [ "$UNIQUE" -gt 0 ]; then
            echo "staging tiene commits que dev no tiene. Abortando."
            git log --oneline origin/dev..origin/staging
            exit 1
          fi

      - name: Promover (fast-forward)
        run: |
          git checkout staging
          git reset --hard origin/dev
          git push origin staging

      - name: Verificar sincronización
        run: |
          DEV=$(git rev-parse origin/dev)
          STG=$(git rev-parse origin/staging)
          echo "dev:     $DEV"
          echo "staging: $STG"
          if [ "$DEV" != "$STG" ]; then
            echo "Hashes no coinciden"
            exit 1
          fi
          echo "staging = dev ($DEV)"

      - name: Resumen
        run: |
          SHORT=$(git rev-parse --short origin/dev)
          {
            echo "## dev -> staging"
            echo ""
            echo "**Commit:** \`$SHORT\`"
            echo "**Motivo:** ${{ inputs.reason }}"
            echo ""
            echo "Vercel y Render desplegaran staging en ~1 min."
          } >> $GITHUB_STEP_SUMMARY